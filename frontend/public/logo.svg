<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="90" fill="url(#grad)"/>
  
  <!-- 知枢文字 -->
  <text x="100" y="115" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="56" 
        font-weight="600" 
        fill="white" 
        text-anchor="middle">
    知枢
  </text>
  
  <!-- 脑神经元装饰 -->
  <circle cx="60" cy="60" r="8" fill="rgba(255,255,255,0.3)"/>
  <circle cx="140" cy="60" r="6" fill="rgba(255,255,255,0.25)"/>
  <circle cx="60" cy="140" r="5" fill="rgba(255,255,255,0.2)"/>
  <circle cx="145" cy="135" r="7" fill="rgba(255,255,255,0.25)"/>
  
  <!-- 连接线 -->
  <path d="M60 60 Q100 80 140 60" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none"/>
  <path d="M60 60 Q80 100 60 140" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none"/>
  <path d="M140 60 Q120 100 145 135" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none"/>
  <path d="M60 140 Q100 150 145 135" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none"/>
</svg>